name: "CI - Calidad de Código (Ruff) y Cobertura de Pruebas (Pytest >= 60%)"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: "Ejecutar Linter Ruff y Suite Pytest con Cobertura"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "2. Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "3. Instalar dependencias"
        run: |
          pip install -r requirements.txt

      - name: "4. Ejecutar Linter Ruff"
        run: |
          ruff check src tests tablero

      - name: "5. Ejecutar Pytest con Cobertura (>= 60% Sello TDL)"
        run: |
          pytest --cov=src --cov-fail-under=60 --cov-report=term-missing
