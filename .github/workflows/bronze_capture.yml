name: "Pipeline Datos Inmobiliario ZMVM - Capas Bronce, Plata (Pandera), Geoespacial y Oro (Linaje)"

on:
  schedule:
    # Ejecución ética automatizada el día 1 de cada mes a las 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/bronze_capture.yml"

permissions:
  contents: write

jobs:
  pipeline-bronce-plata-oro-e2:
    name: "Ejecutar Captura Bronce + Limpieza E1 (Pandera) + Geoespacial y Linaje E2"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "2. Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "3. Instalar dependencias (Pandera, GeoPandas, Shapely, Scikit-Learn, Folium)"
        run: |
          pip install -r requirements.txt

      - name: "4. Ejecutar extractor ético de Capa Bronce (>= 36 meses)"
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: |
          python src/extract_bronze.py

      - name: "5. Ejecutar Pipeline E1 (Integración, Pandera + Cuarentena, Limpieza Plata y Capa Oro)"
        run: |
          python src/pipeline_e1.py

      - name: "6. Ejecutar Pipeline E2 (Integración Geoespacial DENUE/OSM + Linaje Bronce->Oro)"
        run: |
          python -m src.pipeline_e2

      - name: "7. Verificar integridad de Capas Bronce, Plata, Cuarentena, Geoespacial y Linaje Oro"
        run: |
          python -c "
          import json
          from pathlib import Path
          rep1 = json.loads(Path('data/gold/inmobiliario/reporte_auditoria_pipeline_e1.json').read_text(encoding='utf-8'))
          rep2 = json.loads(Path('data/gold/inmobiliario/reporte_auditoria_pipeline_e2.json').read_text(encoding='utf-8'))
          assert rep1['puerta_calidad_pandera_y_cuarentena']['total_aprobados_plata'] >= 1200
          assert rep2['linaje_y_trazabilidad_oro_a_bronce']['registros_oro_con_linaje_completo_pct'] == 100.0
          assert rep2['linaje_y_trazabilidad_oro_a_bronce']['registros_oro_huerfanos'] == 0
          print('Auditoría E1 + E2 verificada con éxito:', rep2['linaje_y_trazabilidad_oro_a_bronce'])
          "

      - name: "8. Commit y Push automático de artefactos actualizados"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze/inmobiliario/ data/silver/inmobiliario/ data/gold/inmobiliario/ docs/E2/mapa_coropletico_precio_equipamiento_zmvm.png docs/E2/mapa_interactivo_zmvm.html
          if git diff --cached --quiet; then
            echo "Sin cambios incrementales en las capas de datos."
          else
            git commit -m "chore(pipeline-e2): actualización automática de capas Bronce, Plata, Geoespacial y Linaje Oro [skip ci]"
            git push
          fi
