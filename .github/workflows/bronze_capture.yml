name: "Pipeline Datos Inmobiliario ZMVM - Capas Bronce, Plata (Pandera) y Oro"

on:
  schedule:
    # Ejecución ética automatizada el día 1 de cada mes a las 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/bronze_capture.yml"

permissions:
  contents: write

jobs:
  pipeline-bronce-plata-oro:
    name: "Ejecutar Captura Bronce + Limpieza E1 (Pandera Quality Gate -> Plata y Oro)"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "2. Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "3. Instalar dependencias (Pandera, Scikit-Learn, Pandas, SciPy)"
        run: |
          pip install -r requirements.txt

      - name: "4. Ejecutar extractor ético de Capa Bronce (>= 36 meses)"
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: |
          python src/extract_bronze.py

      - name: "5. Ejecutar Pipeline E1 (Integración, Pandera + Cuarentena, Limpieza Plata y Capa Oro)"
        run: |
          python src/pipeline_e1.py

      - name: "6. Verificar integridad de Capas Bronce, Plata, Cuarentena y Oro"
        run: |
          python -c "
          import json
          import pandas as pd
          from pathlib import Path
          rep = json.loads(Path('data/gold/inmobiliario/reporte_auditoria_pipeline_e1.json').read_text(encoding='utf-8'))
          assert rep['puerta_calidad_pandera_y_cuarentena']['total_aprobados_plata'] >= 1200
          assert rep['puerta_calidad_pandera_y_cuarentena']['total_enviados_cuarentena'] > 0
          assert rep['reduccion_datos_y_capa_oro']['filas_oro_e1_series_tiempo'] >= 36
          print('Auditoría E1 verificada con éxito:', rep['puerta_calidad_pandera_y_cuarentena'])
          "

      - name: "7. Commit y Push automático de artefactos actualizados"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze/inmobiliario/ data/silver/inmobiliario/ data/gold/inmobiliario/
          if git diff --cached --quiet; then
            echo "Sin cambios incrementales en las capas de datos."
          else
            git commit -m "chore(pipeline): actualización automática de capas Bronce, Plata, Cuarentena y Oro [skip ci]"
            git push
          fi
